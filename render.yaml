# Render Blueprint: Docker web service + managed PostgreSQL.
# Migrations and seed run automatically in docker-entrypoint.sh on every deploy.
services:
  - type: web
    name: business-card-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: business-card-db
          property: connectionString

databases:
  - name: business-card-db
    plan: free
    postgresMajorVersion: '16'
